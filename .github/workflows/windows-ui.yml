# KINO's real window on Windows, driven with real mouse input (tests/windows-ui):
# title bar, window buttons, dragging, maximize, player, fullscreen cursor and mpv docked.
# Runs the Rust app built here (target/release/kino-desktop.exe).
name: Windows UI

on:
  push:
    branches: ["**"]
    paths: ["crates/**", "web/**", "Cargo.lock", "tests/windows-ui/**", "tools/fetch_ffmpeg.ps1", "tools/fetch_mpv_windows.ps1", ".github/workflows/windows-ui.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: KINO
        run: cargo build --release --locked -p kino-desktop
      - name: FFmpeg (test video)
        run: ./tools/fetch_ffmpeg.ps1
      - name: mpv (docked player)
        run: ./tools/fetch_mpv_windows.ps1
      - name: Dependencies
        run: npm ci --prefix tests/windows-ui
      - name: Real window test
        run: node tests/windows-ui/windows_ui.js
