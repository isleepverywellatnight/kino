# Builds KINO for macOS (Apple Silicon) and Windows (x64) on every push and pull
# request to main. Pushing a tag vX.Y.Z (equal to APP_VERSION in kino_version.py)
# publishes a GitHub release with the .dmg, the Windows installer and, when the
# KINO_UPDATE_SIGNING_KEY secret is set, the signed files the in-app updater uses.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version
        id: version
        run: |
          version=$(python -c "import kino_version; print(kino_version.APP_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Le tag ${GITHUB_REF#refs/tags/} ne correspond pas à APP_VERSION ($version) dans kino_version.py"
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|vendor)/' .
      - name: Tests
        run: |
          pip install pytest cryptography==48.0.0 certifi
          python -m pytest -q tests

  macos:
    needs: checks
    runs-on: macos-14
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencies
        run: pip install -r requirements-build.txt
      - name: libmpv (from IINA)
        run: |
          brew install --cask iina
          python tools/vendor_libmpv.py
      - name: Build KINO.app
        run: pyinstaller --noconfirm kino_macos.spec
      - name: Self-check
        run: |
          codesign --verify --deep --strict dist/KINO.app
          dist/KINO.app/Contents/MacOS/KINO --self-check
      - name: Disk image
        run: tools/make_dmg.sh "dist/KINO-$VERSION-arm64.dmg"
      - name: Signed update package
        env:
          KINO_UPDATE_SIGNING_KEY: ${{ secrets.KINO_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KINO_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::KINO_UPDATE_SIGNING_KEY absent : pas de paquet de mise à jour."
            exit 0
          fi
          key="$RUNNER_TEMP/kino-update-key.pem"
          printf '%s\n' "$KINO_UPDATE_SIGNING_KEY" > "$key"
          python build_update_package.py --app dist/KINO.app --key "$key" \
            --output "dist/KINO-$VERSION-arm64.kinoupdate" --notes "KINO $VERSION"
          rm -f "$key"
      - uses: actions/upload-artifact@v4
        with:
          name: kino-macos
          path: |
            dist/KINO-*.dmg
            dist/KINO-*.kinoupdate
          if-no-files-found: error

  windows:
    needs: checks
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Dependencies
        run: pip install -r requirements-build.txt
      - name: mpv
        run: python tools/fetch_mpv_windows.py
      - name: Build KINO.exe
        run: pyinstaller --noconfirm kino_windows.spec
      - name: Self-check
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-check.json"
          $p = Start-Process -FilePath dist\KINO\KINO.exe -ArgumentList "--self-check", "--self-check-report", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-check failed ($($p.ExitCode))" }
      - name: Start-up test
        run: |
          $p = Start-Process -FilePath dist\KINO\KINO.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            foreach ($port in 8080..8089) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match "KINO") { $ok = $true; break }
              } catch {}
            }
          }
          Start-Sleep -Seconds 10
          $alive = -not $p.HasExited
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("dist\startup-windows.png")
          } catch { Write-Warning "Capture d'écran impossible : $_" }
          Stop-Process -Name KINO -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Le serveur de KINO n'a pas répondu" }
          if (-not $alive) { throw "KINO s'est fermé au démarrage" }
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\kino.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Install test
        run: |
          $setup = "dist\KINO-Setup-$env:VERSION-x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\KINO"
          foreach ($f in "KINO.exe", "unins000.exe", "_internal\mpv\mpv.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "$f manquant après installation" }
          }
          $report = Join-Path $env:RUNNER_TEMP "installed-self-check.json"
          $c = Start-Process -FilePath (Join-Path $app "KINO.exe") -ArgumentList "--self-check", "--self-check-report", $report -Wait -PassThru
          Get-Content $report
          if ($c.ExitCode -ne 0) { throw "Self-check of the installed KINO failed" }
          $u = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall failed ($($u.ExitCode))" }
      - name: Installer signature
        env:
          KINO_UPDATE_SIGNING_KEY: ${{ secrets.KINO_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:KINO_UPDATE_SIGNING_KEY) {
            Write-Output "::warning::KINO_UPDATE_SIGNING_KEY absent : installateur non signé pour les mises à jour."
            exit 0
          }
          $key = Join-Path $env:RUNNER_TEMP "kino-update-key.pem"
          Set-Content -Path $key -Value $env:KINO_UPDATE_SIGNING_KEY -NoNewline -Encoding ascii
          python build_update_package.py --installer "dist\KINO-Setup-$env:VERSION-x64.exe" --key $key --notes "KINO $env:VERSION"
          $code = $LASTEXITCODE
          Remove-Item $key
          if ($code -ne 0) { throw "Signing failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: kino-windows
          path: |
            dist/KINO-Setup-*.exe
            dist/KINO-Setup-*.exe.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-screenshot
          path: dist/startup-windows.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kino-*
          path: release
          merge-multiple: true
      - name: Publish
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          sed "s/{{VERSION}}/$VERSION/g" ../.github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" * --repo "$GITHUB_REPOSITORY" --title "KINO $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
