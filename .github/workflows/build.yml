# Builds KINO for macOS (Apple Silicon), Windows (x64 and ARM64) and Linux (x86_64) on every
# push and pull request to main. When main carries a version (Cargo.toml,
# [workspace.package]) that has no release yet, it publishes release vX.Y.Z (and its
# tag) with the .dmg, the Windows installers, the Linux AppImage and, when the KINO_UPDATE_SIGNING_KEY secret is set, the
# signed files the in-app updater uses. Pushing a tag vX.Y.Z does the same.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Releases (downloads, updates, install scripts) are published in this repository.
  RELEASES_REPO: ${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Le tag ${GITHUB_REF#refs/tags/} ne correspond pas à la version ($version) de Cargo.toml"
            exit 1
          fi
          # A new version on main (or its tag) is published once.
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            if ! gh release view "v$version" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          # Whether a release exists yet, for verify-release on a push that publishes nothing.
          if gh release view --repo "$RELEASES_REPO" >/dev/null 2>&1; then released=true; else released=false; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "Version $version, publication : $publish"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The server and the app are tested by the Rust workflow (rust.yml).
      - name: Tests (interface)
        run: |
          node --test tests/test_*.js
          node tools/frontend_check.js
      # Every interface file is type-checked (jsconfig.json, checkJs), its imports included.
      - name: Types (interface)
        run: npx --yes -p typescript@5.9.3 tsc -p jsconfig.json
      - name: Install scripts
        run: |
          bash -n packaging/install.sh
          for script in packaging/build_linux_appimage.sh packaging/build_flatpak.sh tools/fetch_linuxdeploy.sh tools/linux_appimage_test.sh; do
            bash -n "$script"
          done

  macos:
    needs: checks
    runs-on: macos-15
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: FFmpeg to ship
        run: tools/fetch_ffmpeg.sh
      - name: libmpv (from IINA)
        run: |
          brew install --cask iina
          tools/vendor_libmpv.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build KINO.app
        run: |
          cargo build --release --locked -p kino-desktop
          packaging/build_macos_app.sh
      - name: Self-check
        run: |
          codesign --verify --deep --strict dist/KINO.app
          dist/KINO.app/Contents/MacOS/KINO --self-check
      - name: Disk image
        run: packaging/make_dmg.sh dist/KINO-macOS.dmg
      - name: Signed update package
        env:
          KINO_UPDATE_SIGNING_KEY: ${{ secrets.KINO_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KINO_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::KINO_UPDATE_SIGNING_KEY absent : pas de paquet de mise à jour."
            exit 0
          fi
          key="$RUNNER_TEMP/kino-update-key.pem"
          printf '%s\n' "$KINO_UPDATE_SIGNING_KEY" > "$key"
          cargo build --release --locked -p kino --bin kino-release
          target/release/kino-release --app dist/KINO.app --key "$key" \
            --output "dist/KINO-$VERSION-arm64.kinoupdate" --notes "KINO $VERSION"
          rm -f "$key"
      - uses: actions/upload-artifact@v7
        with:
          name: kino-macos
          path: |
            dist/KINO-macOS.dmg
            dist/KINO-*.kinoupdate
          if-no-files-found: error

  windows:
    needs: checks
    # x64, and ARM64 built on an ARM64 runner (KINO-Windows-arm64.exe).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            installer: KINO-Windows.exe
          - arch: arm64
            runner: windows-11-arm
            installer: KINO-Windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      INSTALLER: ${{ matrix.installer }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # The ARM64 runner may come without Rust: rustup then installs the
      # toolchain named in rust-toolchain.toml.
      - name: Rust
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            $machine = if ("${{ matrix.arch }}" -eq "arm64") { "aarch64" } else { "x86_64" }
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$machine-pc-windows-msvc/rustup-init.exe" -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed" }
            Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE ".cargo\bin")
          }
      - name: FFmpeg to ship
        run: ./tools/fetch_ffmpeg.ps1 -Arch ${{ matrix.arch }}
      - name: mpv
        run: ./tools/fetch_mpv_windows.ps1 -Arch ${{ matrix.arch }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build KINO.exe
        run: |
          cargo build --release --locked -p kino-desktop
          ./packaging/build_windows_app.ps1
      - name: Self-check
        run: |
          # Built for this job's architecture: the PE header's machine (0x8664 x64, 0xAA64 ARM64).
          $want = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          foreach ($file in "dist\KINO\KINO.exe", "dist\KINO\libmpv-2.dll", "dist\KINO\mpv\mpv.exe", "dist\KINO\ffmpeg.exe") {
            $bytes = [IO.File]::ReadAllBytes($file)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
            if ($machine -ne $want) { throw ("{0} : machine 0x{1:X4} au lieu de 0x{2:X4}" -f $file, $machine, $want) }
          }
          $report = Join-Path $env:RUNNER_TEMP "self-check.json"
          $p = Start-Process -FilePath dist\KINO\KINO.exe -ArgumentList "--self-check", "--self-check-report", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-check failed ($($p.ExitCode))" }
      - name: Start-up test
        run: |
          $p = Start-Process -FilePath dist\KINO\KINO.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            foreach ($port in 8080..8089) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match "KINO") { $ok = $true; break }
              } catch {}
            }
          }
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          # Responding is false when the window has not processed messages for 5 s (« ne répond pas »).
          $kino = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          $responding = $kino -and $kino.Responding
          Write-Output "Window responding: $responding (handle $($kino.MainWindowHandle))"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("dist\startup-windows.png")
            $small = New-Object System.Drawing.Bitmap $bmp, 640, ([int]($b.Height * 640 / $b.Width))
            $jpg = Join-Path $env:RUNNER_TEMP "startup.jpg"
            $small.Save($jpg, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Output "SCREENSHOT-BASE64-BEGIN"
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes($jpg)))
            Write-Output "SCREENSHOT-BASE64-END"
          } catch { Write-Warning "Capture d'écran impossible : $_" }
          Stop-Process -Name KINO -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          if (-not $ok) { throw "Le serveur de KINO n'a pas répondu" }
          if (-not $alive) { throw "KINO s'est fermé au démarrage" }
          if (-not $responding) { throw "La fenêtre de KINO ne répond pas" }
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=${{ matrix.arch }}" packaging\kino.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Install test
        run: |
          $setup = "dist\$env:INSTALLER"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\KINO"
          foreach ($f in "KINO.exe", "unins000.exe", "libmpv-2.dll", "mpv\mpv.exe", "ffmpeg.exe", "web\index.html") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "$f manquant après installation" }
          }
          $report = Join-Path $env:RUNNER_TEMP "installed-self-check.json"
          $c = Start-Process -FilePath (Join-Path $app "KINO.exe") -ArgumentList "--self-check", "--self-check-report", $report -Wait -PassThru
          Get-Content $report
          if ($c.ExitCode -ne 0) { throw "Self-check of the installed KINO failed" }
          $u = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall failed ($($u.ExitCode))" }
      - name: Installer signature
        env:
          KINO_UPDATE_SIGNING_KEY: ${{ secrets.KINO_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:KINO_UPDATE_SIGNING_KEY) {
            Write-Output "::warning::KINO_UPDATE_SIGNING_KEY absent : installateur non signé pour les mises à jour."
            exit 0
          }
          $key = Join-Path $env:RUNNER_TEMP "kino-update-key.pem"
          Set-Content -Path $key -Value $env:KINO_UPDATE_SIGNING_KEY -NoNewline -Encoding ascii
          cargo build --release --locked -p kino --bin kino-release
          target\release\kino-release.exe --installer "dist\$env:INSTALLER" --key $key --notes "KINO $env:VERSION"
          $code = $LASTEXITCODE
          Remove-Item $key
          if ($code -ne 0) { throw "Signing failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: kino-windows-${{ matrix.arch }}
          path: |
            dist/${{ matrix.installer }}
            dist/${{ matrix.installer }}.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-startup-screenshot-${{ matrix.arch }}
          path: dist/startup-windows.png
          if-no-files-found: ignore

  linux:
    needs: checks
    # The oldest supported Ubuntu: the AppImage runs on systems with its glibc
    # (2.35) or a newer one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev patchelf ffmpeg \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            xvfb imagemagick
      - name: linuxdeploy
        run: tools/fetch_linuxdeploy.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the AppImage
        run: |
          cargo build --release --locked -p kino-desktop
          packaging/build_linux_appimage.sh
      # Self-check, start-up on a virtual screen, video in the page.
      - name: AppImage test
        run: tools/linux_appimage_test.sh
      - name: AppImage signature
        env:
          KINO_UPDATE_SIGNING_KEY: ${{ secrets.KINO_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          if [ -z "$KINO_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::KINO_UPDATE_SIGNING_KEY absent : AppImage non signé pour les mises à jour."
            exit 0
          fi
          key="$RUNNER_TEMP/kino-update-key.pem"
          printf '%s\n' "$KINO_UPDATE_SIGNING_KEY" > "$key"
          cargo build --release --locked -p kino --bin kino-release
          target/release/kino-release --appimage dist/KINO-Linux-x86_64.AppImage --key "$key" --notes "KINO $VERSION"
          rm -f "$key"
      - uses: actions/upload-artifact@v7
        with:
          name: kino-linux
          path: |
            dist/KINO-Linux-x86_64.AppImage
            dist/KINO-Linux-x86_64.AppImage.sig
          if-no-files-found: error
      # For the Flatpak job (not a release file: its name is not kino-*).
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: target/release/kino-desktop
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-screenshots
          path: dist/*-linux.png
          if-no-files-found: ignore

  # The same Linux build as a Flatpak bundle on the GNOME runtime, installed
  # and started here.
  flatpak:
    needs: [checks, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: target/release
      - name: Flatpak tools
        run: |
          chmod 755 target/release/kino-desktop
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          # Flatpak's sandbox needs user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: FFmpeg to ship
        run: tools/fetch_ffmpeg.sh
      - name: Build the Flatpak
        run: packaging/build_flatpak.sh
      - name: Flatpak test
        run: |
          # The runtime's codecs (freedesktop 25.08: codecs-extra; before: ffmpeg-full).
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.codecs-extra//25.08 \
            || flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.ffmpeg-full//25.08 \
            || echo "::warning::No codecs extension found for the 25.08 runtime"
          flatpak install --user -y --noninteractive dist/KINO-Linux-x86_64.flatpak
          flatpak run com.kino.desktop --self-check
          # Start-up on a virtual screen: KINO's server answers with its page.
          xvfb-run -a flatpak run com.kino.desktop > "$RUNNER_TEMP/kino.log" 2>&1 &
          ok=false
          for _ in $(seq 60); do
            sleep 2
            if page=$(curl -fsS http://127.0.0.1:8080/ 2>/dev/null) && [[ "$page" == *KINO* ]]; then ok=true; break; fi
          done
          sleep 10
          alive=false
          flatpak ps | grep -q com.kino.desktop && alive=true
          flatpak kill com.kino.desktop || true
          cat "$RUNNER_TEMP/kino.log"
          [ "$ok" = true ] || { echo "::error::KINO's server did not answer"; exit 1; }
          [ "$alive" = true ] || { echo "::error::KINO closed at start-up"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: kino-flatpak
          path: dist/KINO-Linux-x86_64.flatpak
          if-no-files-found: error

  release:
    if: needs.checks.outputs.publish == 'true'
    needs: [checks, macos, windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build attestations: `gh attestation verify <file> -R <this repository>`
      # names the workflow and the commit that built a downloaded file.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: kino-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cp packaging/install.sh packaging/install.ps1 release/
          cd release
          sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish
        run: |
          cd release
          sed "s/{{VERSION}}/$VERSION/g" ../.github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" * --repo "$RELEASES_REPO" --target "$GITHUB_SHA" \
            --title "KINO $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # The latest release, installed the way users do: the install scripts of the
  # README, as they stand in this commit. After each publication and on every push.
  verify-release:
    needs: [checks, release]
    if: >-
      always() && needs.checks.result == 'success' && (needs.release.result == 'success' ||
      (needs.release.result == 'skipped' && github.event_name == 'push' && needs.checks.outputs.released == 'true'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/install.sh
          /Applications/KINO.app/Contents/MacOS/KINO --self-check
      - name: Install (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, as on users' PCs, running the script the way « irm | iex » does.
        shell: powershell
        run: |
          Get-Content -Raw -Encoding UTF8 packaging/install.ps1 | Invoke-Expression
          Start-Sleep -Seconds 5
          Stop-Process -Name KINO -Force -ErrorAction SilentlyContinue
          $report = Join-Path $env:RUNNER_TEMP "self-check.json"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\KINO\KINO.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-check", "--self-check-report", $report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-check failed" }
      - name: Download (Linux)
        if: runner.os == 'Linux'
        run: |
          url=https://github.com/$RELEASES_REPO/releases/latest/download/KINO-Linux-x86_64.AppImage
          if ! curl -fsSL --retry 3 -o KINO.AppImage "$url"; then
            echo "::notice::The latest release has no AppImage yet."
            exit 0
          fi
          chmod 755 KINO.AppImage
          # What a desktop has and the AppImage takes from the system (GL, X11, sound).
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgbm1 libx11-xcb1 libxcb-dri3-0 libasound2t64 \
            libfontconfig1 libharfbuzz0b libfribidi0 libwayland-client0 libusb-1.0-0
          APPIMAGE_EXTRACT_AND_RUN=1 ./KINO.AppImage --self-check
