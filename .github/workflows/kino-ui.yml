# KINO's native interface (crates/kino-ui, gpui), phase G0 of docs/dev/plan-gpui.md:
# it builds on macOS, Windows and Linux, opens its window and scrolls a grid of
# 300 posters by itself (--bench), printing each system's frame times; then it
# plays a 1080p test pattern with libmpv under gpui's controls (--video --bench)
# and keeps a screenshot of it.
name: Native UI (gpui)

on:
  push:
    branches: ["**"]
    paths: ["crates/kino-ui/**", "crates/kino/**", "web/js/i18n/**", ".github/workflows/kino-ui.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/kino-ui/**", "crates/kino/**", "web/js/i18n/**", ".github/workflows/kino-ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kino-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries and a virtual screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb openbox libmpv2 imagemagick \
            libdbus-1-dev pkg-config
      - name: libmpv (the builds KINO ships)
        if: runner.os != 'Linux'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install --cask iina
            tools/vendor_libmpv.sh
            echo "KINO_LIBMPV=$PWD/vendor/libmpv/libmpv.2.dylib" >> "$GITHUB_ENV"
          else
            pwsh tools/fetch_mpv_windows.ps1
            echo "KINO_LIBMPV=$PWD/vendor/libmpv-windows/libmpv-2.dll" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/kino-ui
      - name: Build
        working-directory: crates/kino-ui
        run: cargo build --release --locked
      - name: Tests
        working-directory: crates/kino-ui
        run: cargo test --release --locked
      - name: Format and lints
        working-directory: crates/kino-ui
        # Each system checks its own code (native.rs, mac_native.rs): rustfmt,
        # then Clippy with warnings as errors (rust-skills: lint-*).
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Fast-scroll bench
        working-directory: crates/kino-ui
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1280x800x24 & sleep 1
            DISPLAY=:99 openbox & sleep 1
            export DISPLAY=:99
          fi
          exe=target/release/kino-ui
          [ "$RUNNER_OS" = Windows ] && exe=target/release/kino-ui.exe
          out=$("$exe" --bench | tee /dev/stderr | grep "KINO-UI BENCH" || true)
          [ -n "$out" ] || { echo "::error::The bench printed nothing (the window did not run)"; exit 1; }
          echo "::notice title=${{ matrix.os }}::${out#KINO-UI BENCH }"
      - name: Shell
        working-directory: crates/kino-ui
        run: |
          # The shell opens every screen, then Back returns to the first; then
          # real keys: Ctrl/⌘+K, "matrix" typed in the search field (KINO's
          # search answers), Escape;
          # then Spanish from Settings (shared state) and back; then KINO's Films
          # and Series catalogs, loaded through the kino crate.
          if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99; fi
          exe=target/release/kino-ui
          [ "$RUNNER_OS" = Windows ] && exe=target/release/kino-ui.exe
          out=$(KINO_LANG=fr "$exe" --shell-check 2>/dev/null | grep "KINO-UI SHELL" || true)
          [ -n "$out" ] || { echo "::error::The shell check printed nothing"; exit 1; }
          echo "::notice title=shell ${{ matrix.os }}::${out#KINO-UI SHELL }"
          echo "${out#KINO-UI SHELL }" | $(command -v python3 || command -v python) -c "
          import json, sys
          # UTF-8 whatever the system's code page (Windows reads cp1252).
          r = json.loads(sys.stdin.buffer.read().decode('utf-8'))
          screens = ['Movies', 'Series', 'Anime', 'Manga', 'Tonight', 'Explore', 'Library', 'Settings']
          assert r['drawn'] == screens + screens[-2::-1] + ['Settings'], r['drawn']
          # It ends on Settings, opened from Films: Back leads there.
          assert r['can_go_back'] is True
          assert r['typed'] == 'matrix', r['typed']
          # The search those keys started, through kino::catalog::search.
          assert r['search'] and r['search']['count'] > 0, r['search']
          assert r['cleared'] is True
          assert r['spanish_settings'] == 'Ajustes', r['spanish_settings']
          assert r['spanish_loading'] == 'Cargando\u2026', ascii(r['spanish_loading'])
          assert r['back_loading'] == 'Chargement\u2026', ascii(r['back_loading'])
          # KINO's catalogs from the network, through the kino crate.
          for name in ('movies', 'series', 'anime'):
              c = r[name]
              assert c['count'] > 0 and c['with_poster'] > 0, (name, c)
          # The first film's page, from KINO's metadata, then Back closes it.
          page = r['title_page']
          assert page and page['page'] and page['page'].get('name'), page
          assert page['page']['description'] is True, page
          assert page['closed_by_back'] is True, page
          # The Films grid by genre and rating, as its chips pick them.
          f = r['filtered']
          assert f and f['genre'] == 'Action' and f['sort'] == 'imdbRating', f
          assert f['count'] > 0 and not f['error'], f
          "
      - name: Processor at rest
        working-directory: crates/kino-ui
        run: |
          # The grid on screen, nothing moving: under 1 % of a core (plan-gpui.md).
          if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99; fi
          exe=target/release/kino-ui
          [ "$RUNNER_OS" = Windows ] && exe=target/release/kino-ui.exe
          out=$("$exe" --idle 2>/dev/null | grep "KINO-UI IDLE" || true)
          [ -n "$out" ] || { echo "::error::The idle run printed nothing"; exit 1; }
          echo "::notice title=idle ${{ matrix.os }}::${out#KINO-UI IDLE }"
          pct=$(echo "${out#KINO-UI IDLE }" | $(command -v python3 || command -v python) -c "import json,sys; print(json.load(sys.stdin)['cpu_pct'])")
          # gpui keeps macOS's display link running while the window shows
          # (60 wake-ups a second, nothing drawn): ~0.7–1.3 % on GitHub's
          # macOS VMs. plan-gpui.md tracks pausing it; macOS's budget is 2 %.
          budget=1.0
          [ "$RUNNER_OS" = macOS ] && budget=2.0
          awk -v p="$pct" -v b="$budget" 'BEGIN { exit !(p < b) }' || { echo "::error::$pct % of a core at rest (budget: $budget %)"; exit 1; }
      - name: Video under gpui's controls
        working-directory: crates/kino-ui
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99; fi
          exe=target/release/kino-ui
          [ "$RUNNER_OS" = Windows ] && exe=target/release/kino-ui.exe
          "$exe" --video --bench > video.log 2>&1 &
          sleep 5
          case "$RUNNER_OS" in
            Linux) import -window root video.png ;;
            macOS) screencapture -x video.png || true ;;
            Windows) pwsh -NoProfile -Command '
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $p = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($p).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $p.Save("video.png")' ;;
          esac
          wait || true
          cat video.log
          out=$(grep "KINO-UI VIDEO {" video.log || true)
          [ -n "$out" ] || { echo "::error::The player printed nothing"; exit 1; }
          frames=$(echo "${out#KINO-UI VIDEO }" | $(command -v python3 || command -v python) -c "import json,sys; print(json.load(sys.stdin)['video_frames'])")
          [ "$frames" -ge 60 ] || { echo "::error::Only $frames video frames reached the screen"; exit 1; }
          echo "::notice title=video ${{ matrix.os }}::${out#KINO-UI VIDEO }"
      - name: Native video under gpui (Windows, macOS)
        if: runner.os != 'Linux'
        working-directory: crates/kino-ui
        run: |
          # mpv draws itself under gpui's transparent surface: a child window on
          # Windows (a real click on the play button must reach gpui), an
          # OpenGL view under gpui's on macOS (mpv must draw the frames).
          exe=target/release/kino-ui
          [ "$RUNNER_OS" = Windows ] && exe=target/release/kino-ui.exe
          "$exe" --video --native --bench > native.log 2>&1 &
          sleep 5
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command '
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $p = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($p).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $p.Save("video-native.png")'
          else
            screencapture -x video-native.png || true
          fi
          wait || true
          cat native.log
          out=$(grep "KINO-UI VIDEO {" native.log || true)
          [ -n "$out" ] || { echo "::error::The native player printed nothing"; exit 1; }
          echo "::notice title=native video ${{ matrix.os }}::${out#KINO-UI VIDEO }"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$out" | grep -q '"click_reached_controls":true' \
              || { echo "::error::A click over mpv's window did not reach gpui's controls"; exit 1; }
          else
            read -r frames accelerated < <(echo "${out#KINO-UI VIDEO }" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['video_frames'], str(r['gl_accelerated']).lower())")
            if [ "$accelerated" = true ]; then
              [ "$frames" -ge 60 ] || { echo "::error::mpv drew only $frames frames under gpui"; exit 1; }
            else
              # GitHub's macOS virtual machines have no hardware OpenGL (Metal
              # only): the path must work, its speed is measured on a real Mac.
              [ "$frames" -ge 1 ] || { echo "::error::mpv drew nothing under gpui"; exit 1; }
              echo "::warning title=native video ${{ matrix.os }}::OpenGL is software-only on this runner: $frames frames drawn, speed not measured"
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-${{ matrix.os }}
          path: crates/kino-ui/video*.png
          if-no-files-found: ignore
