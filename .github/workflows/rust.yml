# KINO in Rust (crates/): tests and lints on every push, on the three systems
# KINO runs on. The version of Rust is the one in rust-toolchain.toml.
name: Rust

on:
  push:
    branches: ["**"]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "web/**", "src/kino_version.py", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Window libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
