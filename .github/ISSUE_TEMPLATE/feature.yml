name: Suggest a feature
description: An idea that would make KINO better
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like KINO to do, and what it would let you do.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. What you do instead now, or what gets in the way.
