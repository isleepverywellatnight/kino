[package]
name = "kino"
version.workspace = true
edition = "2024"

[[bin]]
name = "kino-server"
path = "src/main.rs"

[[bin]]
name = "kino-release"
path = "src/bin/kino-release.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
axum = "0.8"
dirs = "6"
form_urlencoded = "1"
hex = "0.4"
html-escape = "0.2"
md-5 = "0.10"
rand = "0.9"
regex = "1"
scraper = { version = "0.29.0", default-features = false }
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
percent-encoding = "2"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
tar = "0.4"
flate2 = "1"
plist = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal", "process"] }
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
fancy-regex = "0.14"
base64 = "0.22"
futures-util = "0.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
indexmap = "2.14.2"
csv = "1"
fs4 = "1.1.0"
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target."cfg(unix)".dependencies]
libc = "0.2"
