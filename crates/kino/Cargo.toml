[package]
name = "kino"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
axum = "0.8"
dirs = "6"
form_urlencoded = "1"
hex = "0.4"
html-escape = "0.2"
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
fancy-regex = "0.14"
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
wiremock = "0.6"
