[package]
name = "kino-desktop"
version.workspace = true
edition = "2024"
license = "MIT"
description = "KINO's desktop app: the window, its bridge and the server in one process"

[dependencies]
kino = { path = "../kino" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process"] }
tao = "0.37.2"
wry = "0.57.2"
rfd = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.9"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
objc2-media-player = "0.3"
objc2-app-kit = "0.3"
libloading = "0.9"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
embed-resource = "3"
