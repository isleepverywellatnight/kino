# KINO's native interface (gpui), docs/dev/plan-gpui.md. Phase G0: a go/no-go
# trial. Its own workspace for now: gpui pins its dependencies (Cargo.lock
# from the gpui crate), and KINO's crates join it once they agree.
[package]
name = "kino-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
gpui = "=0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"
libloading = "0.8"
kino = { path = "../kino" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
raw-window-handle = "0.6"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSOpenGL", "NSOpenGLView", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = "0.3"

[build-dependencies]
serde_json = "1"

# Every unsafe block says why it is sound (rust-skills: unsafe-safety-comment).
[lints.clippy]
undocumented_unsafe_blocks = "deny"

# xattr 0.2.3 with one constant fixed for recent libc (patches/README.md).
[patch.crates-io]
xattr = { path = "patches/xattr-0.2.3" }

[profile.release]
debug = false

[workspace]
