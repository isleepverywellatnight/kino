<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    KINO's one icon set. 24-unit grid, round ends, no stroke width here:
    `.ui-icon` sets it in design.css so every icon has the same fine line at its size.
    Each sidebar icon has a `-fill` twin shown when its tab is active.
  -->

  <!-- Sidebar -->
  <symbol id="film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 4v16M16.5 4v16M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21"/>
  </symbol>
  <symbol id="film-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path fill-rule="evenodd" d="M5.5 3.2h13a3.3 3.3 0 0 1 3.3 3.3v11a3.3 3.3 0 0 1-3.3 3.3h-13a3.3 3.3 0 0 1-3.3-3.3v-11a3.3 3.3 0 0 1 3.3-3.3ZM4.4 6.2v2.4h2.1V6.2ZM4.4 10.8v2.4h2.1v-2.4ZM4.4 15.4v2.4h2.1v-2.4ZM17.5 6.2v2.4h2.1V6.2ZM17.5 10.8v2.4h2.1v-2.4ZM17.5 15.4v2.4h2.1v-2.4Z"/>
  </symbol>

