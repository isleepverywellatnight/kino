      <path d="M12 12C9.4 9.7 9.1 5.9 10.6 3.9L12 4.9l1.4-1C14.9 5.9 14.6 9.7 12 12Z" transform="rotate(72 12 12)"/>
      <path d="M12 12C9.4 9.7 9.1 5.9 10.6 3.9L12 4.9l1.4-1C14.9 5.9 14.6 9.7 12 12Z" transform="rotate(144 12 12)"/>
      <path d="M12 12C9.4 9.7 9.1 5.9 10.6 3.9L12 4.9l1.4-1C14.9 5.9 14.6 9.7 12 12Z" transform="rotate(216 12 12)"/>
      <path d="M12 12C9.4 9.7 9.1 5.9 10.6 3.9L12 4.9l1.4-1C14.9 5.9 14.6 9.7 12 12Z" transform="rotate(288 12 12)"/>
